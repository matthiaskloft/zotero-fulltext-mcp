  <g id="search-results">
    <rect x="928" y="185" width="199" height="173" rx="16" fill="url(#panel)" stroke="#667781" stroke-width="2"/>
    <path d="M953 227V261M953 294V334" stroke="#64d6e2" stroke-width="2.5"/>
    <g fill="#4bb9c9" stroke="#79e2ec" stroke-width="1">
      <circle cx="953" cy="212" r="5.5"/>
      <circle cx="953" cy="279" r="5.5"/>
    </g>
    <g fill="none" stroke-width="4">
      <path d="M971 212H995M971 240H1029M971 253H1008M971 279H994M971 306H1024M971 333H995" stroke="#ebf0ed"/>
      <path d="M971 226H1005M1007 293H1046M971 320H1010" stroke="#fa7b64"/>
      <path d="M1010 226H1060M1035 240H1080M1015 253H1051M971 293H1001M1053 293H1089M1030 306H1080M1017 320H1088M1002 333H1036" stroke="#5c737f"/>
    </g>
  </g>

  <g id="mcp-endpoint">
    <circle cx="1214" cy="267" r="53" fill="#071522" stroke="#ff775f" stroke-width="4"/>
    <text x="1214" y="279" text-anchor="middle" fill="#ff775f" font-family="Arial, sans-serif" font-size="35" font-weight="700">MCP</text>
  </g>

  <g id="wordmark" font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="473" fill="#f7f7f2" font-size="110" font-weight="700" letter-spacing="-3">zotero-fulltext-mcp</text>
    <text x="84" y="543" fill="#69dbe7" font-size="46" font-weight="400">Local-first full-text search for your Zotero library</text>
  </g>
</svg>
