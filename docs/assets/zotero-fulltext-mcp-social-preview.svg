<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">zotero-fulltext-mcp</title>
  <desc id="description">Linked PDFs become Markdown, a full-text index, and searchable passages exposed through MCP. All arrows point left to right.</desc>
  <defs>
    <radialGradient id="background" cx="48%" cy="40%" r="78%">
      <stop offset="0" stop-color="#092034"/>
      <stop offset="0.6" stop-color="#041221"/>
      <stop offset="1" stop-color="#020912"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffefa"/>
      <stop offset="1" stop-color="#e6e9e9"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#aeb8bc"/>
      <stop offset="1" stop-color="#e9eeee"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0b1c29"/>
      <stop offset="1" stop-color="#06121e"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#4aa1b6" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#69c9d9" opacity="0.22"/>
    </pattern>
    <g id="sheet">
      <path d="M0 5Q0 0 5 0H140L174 34V232Q174 238 168 238H5Q0 238 0 232Z" fill="url(#paper)" stroke="#d8dedf" stroke-width="1.2"/>
      <path d="M140 0V30Q140 34 145 34H174" fill="url(#fold)" stroke="#9ba6ab" stroke-width="1.2"/>
    </g>
    <g id="paper-lines" fill="none" stroke="#78838b" stroke-width="2.5">
      <path d="M18 25H127M18 37H113M61 62H154M61 73H154M18 85H154M18 96H154M18 107H154"/>
      <path d="M18 174H154M18 185H154M18 196H126M18 207H154M18 218H99"/>
    </g>
    <g id="forward" fill="none" stroke="#ff775f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle r="19"/>
      <path d="M-8 0H8M1-7L8 0 1 7"/>
    </g>
  </defs>

  <g id="backdrop">
    <path fill="url(#background)" d="M0 0H1280V640H0Z"/>
    <path fill="url(#grid)" d="M0 0H1280V640H0Z"/>
    <path fill="url(#dots)" d="M1154 34H1245V141H1154Z"/>
    <g fill="none" stroke="#5b9cac" stroke-width="1" opacity="0.16">
      <path d="M918 65H978V143H918ZM929 83H965M929 97H965M929 111H954M929 126H965"/>
      <path d="M1034 35H1102L1127 60V157H1034ZM1102 35V60H1127M1050 78H1110M1050 92H1110M1050 106H1083M1050 140V121H1061V140M1073 140V111H1084V140M1096 140V101H1107V140"/>
      <path d="M404 38L455 193M440 361L414 441M337 554H1109"/>
    </g>
  </g>

  <g id="pipeline-connectors" stroke="#ff775f" fill="none" stroke-linecap="round">
    <path d="M332 267H371M421 267H445M598 267H626M678 267H691M832 267H860M912 267H920" stroke-width="2.5" stroke-dasharray="1 8" opacity="0.85"/>
    <use href="#forward" transform="translate(396 267)"/>
    <use href="#forward" transform="translate(652 267)"/>
    <use href="#forward" transform="translate(886 267)"/>
    <path id="mcp-arrow" d="M1126 267H1151M1144 260L1151 267 1144 274" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <g id="linked-pdfs">
    <g transform="translate(143 169)" opacity="0.8">
      <use href="#sheet" transform="scale(0.98 0.82)"/>
      <path d="M22 48H145M22 61H145M22 74H145M22 87H145M22 100H145M22 139H145M22 153H132M22 167H145" fill="none" stroke="#53636e" stroke-width="3"/>
    </g>
    <g transform="translate(105 145)" opacity="0.94">
      <use href="#sheet" transform="scale(1 0.9)"/>
      <path d="M22 49H147M22 62H147M22 75H147M22 88H147M22 101H147M22 161H147M22 175H136M22 189H147" fill="none" stroke="#6f7b83" stroke-width="2.7"/>
    </g>
    <g transform="translate(68 110)">
      <use href="#sheet"/>
      <use href="#paper-lines"/>
