    <text x="15" y="70" fill="#f37965" font-family="Arial, sans-serif" font-size="44" font-weight="700">.md</text>
    <path d="M17 89H64" fill="none" stroke="#f37965" stroke-width="5"/>
    <path d="M17 104H112M17 116H112M17 128H112M17 140H112M17 152H96M17 164H112" fill="none" stroke="#455764" stroke-width="3"/>
  </g>

  <g id="fulltext-index" fill="none" stroke="#69dbe7" stroke-width="2.5">
    <path d="M700 199V317C700 331 725 341 757 341S814 331 814 317V199" fill="#082536" fill-opacity="0.5"/>
    <ellipse cx="757" cy="199" rx="57" ry="21"/>
    <path d="M700 230C700 244 725 251 757 251S814 244 814 230M700 262C700 276 725 283 757 283S814 276 814 262M700 294C700 308 725 315 757 315S814 308 814 294"/>
    <g fill="#69dbe7" stroke="none">
      <circle cx="723" cy="232" r="2"/><circle cx="742" cy="236" r="2"/><circle cx="761" cy="237" r="2"/><circle cx="780" cy="235" r="2"/>
      <circle cx="723" cy="264" r="2"/><circle cx="742" cy="268" r="2"/><circle cx="761" cy="269" r="2"/><circle cx="780" cy="267" r="2"/>
      <circle cx="723" cy="296" r="2"/><circle cx="742" cy="300" r="2"/><circle cx="761" cy="301" r="2"/>
      <circle cx="723" cy="326" r="2"/><circle cx="742" cy="330" r="2"/><circle cx="761" cy="331" r="2"/>
    </g>
