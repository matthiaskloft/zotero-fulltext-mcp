      <path d="M18 121H83V161H18Z" fill="#b9c1c5"/>
      <path d="M94 121H154M94 132H154M94 143H154M94 154H139" fill="none" stroke="#7a858b" stroke-width="2.5"/>
      <path d="M91 224V212H100V224M106 224V200H115V224M121 224V206H130V224M136 224V193H145V224" fill="#a4afb5"/>
    </g>
  </g>

