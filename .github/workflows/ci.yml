name: CI

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra mcp --extra test --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest -q -m "not live_zotero and not live_zotero_container and not live_zotero_corpus"

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uv tool run twine check --strict dist/*

      - name: Verify built distributions and clean pip install
        run: uv run python tools/check_distribution.py
